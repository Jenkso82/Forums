<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Form Builder</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --card-bg: #161b22;
            --accent-color: #58a6ff;
            --accent-hover: #79c0ff;
            --progress-bg: #30363d;
            --progress-fill: #238636;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
            --border-color: #30363d;
            --tg-theme-bg: var(--tg-theme-bg-color, var(--bg-color));
            --tg-theme-text: var(--tg-theme-text-color, var(--text-color));
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SF Mono', 'Courier New', monospace;
        }
        body {
            background: var(--tg-theme-bg);
            color: var(--tg-theme-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            font-size: 14px;
            line-height: 1.5;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 0 10px;
        }
        .create-button, .forms-button {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin: 5px 0;
            width: 100%;
        }
        .create-button:hover, .forms-button:hover {
            background: var(--accent-hover);
        }
        .form-builder, .forms-list, .form-viewer {
            display: none;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-top: 10px;
        }
        .form-builder.active, .forms-list.active, .form-viewer.active {
            display: block;
        }
        .form-builder input, .form-builder textarea, .form-viewer input, .form-viewer textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #0d1117;
            color: var(--text-color);
            font-size: 14px;
        }
        .form-builder input:focus, .form-builder textarea:focus, .form-viewer input:focus, .form-viewer textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        .question {
            background: #21262d;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        .question input {
            margin-bottom: 10px;
        }
        .question select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #0d1117;
            color: var(--text-color);
            font-size: 14px;
        }
        .variant {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .variant input {
            flex: 1;
            margin-right: 10px;
        }
        .variant button, .question button.delete, .add-question, .add-variant, .submit-form, .back-button, .form-link {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s ease;
        }
        .variant button:hover, .question button.delete:hover, .add-question:hover, .add-variant:hover, .submit-form:hover, .back-button:hover, .form-link:hover {
            background: var(--accent-hover);
        }
        .question button.delete {
            margin-top: 10px;
            background: #d73a49;
        }
        .question button.delete:hover {
            background: #f85149;
        }
        .add-question, .add-variant {
            background: #238636;
            margin: 5px 0;
        }
        .add-question:hover, .add-variant:hover {
            background: #2ea043;
        }
        .submit-form, .back-button, .form-link {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            margin-top: 10px;
        }
        .forms-list h2, .form-viewer h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--accent-color);
        }
        .form-card {
            background: #21262d;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        .form-card h3 {
            font-size: 16px;
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        .form-card p {
            font-size: 12px;
            color: #8b949e;
        }
        .notification {
            position: fixed;
            top: 10px;
            right: 10px;
            background: var(--accent-color);
            color: #fff;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .notification.active {
            opacity: 1;
        }
        .form-viewer .question-view {
            margin-bottom: 15px;
        }
        .form-viewer .question-view label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: var(--accent-color);
        }
        .form-viewer .variant-view {
            margin-bottom: 8px;
        }
        .progress-bar {
            background: var(--progress-bg);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            background: var(--progress-fill);
            height: 100%;
            transition: width 0.3s ease;
        }
        .variant-stats {
            font-size: 10px;
            color: #8b949e;
            margin-top: 3px;
        }
        @media (max-width: 600px) {
            .container {
                padding: 0 5px;
            }
            .form-builder, .forms-list, .form-viewer {
                padding: 15px;
            }
            .create-button, .forms-button {
                padding: 10px 20px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="create-button">Создать форму</button>
        <button class="forms-button">Доступные формы</button>
        
        <div class="forms-list main-list" id="main-list">
            <h2>Популярные формы</h2>
            <div id="main-forms-container"></div>
        </div>
        
        <div class="form-builder" id="form-builder">
            <input type="text" id="form-name" placeholder="Название формы">
            <textarea id="form-description" placeholder="Описание формы"></textarea>
            <div class="question-section" id="questions">
                <div class="question" data-index="0">
                    <input type="text" class="question-title" placeholder="Название вопроса">
                    <select class="question-type" onchange="updateVariants(0)">
                        <option value="short_text">Короткий текст</option>
                        <option value="long_text">Длинный текст</option>
                        <option value="radio">Один выбор</option>
                        <option value="checkbox">Множественный выбор</option>
                        <option value="dropdown">Выпадающий список</option>
                    </select>
                    <div class="variants" data-index="0">
                        <div class="variant">
                            <input type="text" class="variant-title" placeholder="Вариант ответа">
                            <button onclick="removeVariant(0, 0)">Удалить</button>
                        </div>
                    </div>
                    <button class="add-variant" onclick="addVariant(0)">Добавить вариант</button>
                    <button class="delete" onclick="removeQuestion(0)">Удалить вопрос</button>
                </div>
            </div>
            <button class="add-question">Добавить вопрос</button>
            <button class="submit-form" id="create-form">Создать форму</button>
        </div>

        <div class="forms-list" id="forms-list">
            <h2>Доступные формы</h2>
            <div id="forms-container"></div>
            <button class="back-button">Назад</button>
        </div>

        <div class="form-viewer" id="form-viewer">
            <h2 id="viewer-title"></h2>
            <p id="viewer-description"></p>
            <div id="viewer-questions"></div>
            <button class="submit-form" id="submit-answers">Отправить ответы</button>
            <button class="back-button">Назад</button>
        </div>

        <div class="notification" id="notification"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        document.documentElement.style.setProperty('--tg-theme-bg', tg.themeParams.bg_color || '#0d1117');
        document.documentElement.style.setProperty('--tg-theme-text', tg.themeParams.text_color || '#c9d1d9');

        let questionCount = 1;
        let forms = JSON.parse(localStorage.getItem('forms')) || [];

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('active');
            setTimeout(() => notification.classList.remove('active'), 2000);
        }

        function startFormBuilder() {
            document.querySelector('.create-button').style.display = 'none';
            document.querySelector('.forms-button').style.display = 'none';
            document.querySelector('.main-list').style.display = 'none';
            document.querySelector('.form-builder').classList.add('active');
            tg.MainButton.show();
            tg.MainButton.setText('Назад');
            tg.MainButton.onClick(backToMain);
        }

        function showFormsList() {
            document.querySelector('.create-button').style.display = 'none';
            document.querySelector('.forms-button').style.display = 'none';
            document.querySelector('.main-list').style.display = 'none';
            document.querySelector('.forms-list').classList.add('active');
            tg.MainButton.show();
            tg.MainButton.setText('Назад');
            tg.MainButton.onClick(backToMain);
            loadForms();
        }

        function backToMain() {
            document.querySelector('.create-button').style.display = 'block';
            document.querySelector('.forms-button').style.display = 'block';
            document.querySelector('.main-list').style.display = 'block';
            document.querySelector('.form-builder').classList.remove('active');
            document.querySelector('.forms-list').classList.remove('active');
            document.querySelector('.form-viewer').classList.remove('active');
            tg.MainButton.hide();
        }

        function addQuestion() {
            const questionsDiv = document.getElementById('questions');
            const newQuestion = document.createElement('div');
            newQuestion.classList.add('question');
            newQuestion.dataset.index = questionCount;
            newQuestion.innerHTML = `
                <input type="text" class="question-title" placeholder="Название вопроса">
                <select class="question-type" onchange="updateVariants(${questionCount})">
                    <option value="short_text">Короткий текст</option>
                    <option value="long_text">Длинный текст</option>
                    <option value="radio">Один выбор</option>
                    <option value="checkbox">Множественный выбор</option>
                    <option value="dropdown">Выпадающий список</option>
                </select>
                <div class="variants" data-index="${questionCount}">
                    <div class="variant">
                        <input type="text" class="variant-title" placeholder="Вариант ответа">
                        <button onclick="removeVariant(${questionCount}, 0)">Удалить</button>
                    </div>
                </div>
                <button class="add-variant" onclick="addVariant(${questionCount})">Добавить вариант</button>
                <button class="delete" onclick="removeQuestion(${questionCount})">Удалить вопрос</button>
            `;
            questionsDiv.appendChild(newQuestion);
            updateVariants(questionCount);
            questionCount++;
        }

        function addVariant(questionIndex) {
            const variantsDiv = document.querySelector(`.variants[data-index="${questionIndex}"]`);
            const variantCount = variantsDiv.querySelectorAll('.variant').length;
            const newVariant = document.createElement('div');
            newVariant.classList.add('variant');
            newVariant.innerHTML = `
                <input type="text" class="variant-title" placeholder="Вариант ответа">
                <button onclick="removeVariant(${questionIndex}, ${variantCount})">Удалить</button>
            `;
            variantsDiv.appendChild(newVariant);
        }

        function removeVariant(questionIndex, variantIndex) {
            const variantsDiv = document.querySelector(`.variants[data-index="${questionIndex}"]`);
            const variants = variantsDiv.querySelectorAll('.variant');
            if (variants.length > 1) variants[variantIndex].remove();
            else showNotification('Нельзя удалить последний вариант!');
        }

        function updateVariants(questionIndex) {
            const question = document.querySelector(`.question[data-index="${questionIndex}"]`);
            const type = question.querySelector('.question-type').value;
            const variantsDiv = question.querySelector('.variants');
            const addVariantBtn = question.querySelector('.add-variant');
            variantsDiv.style.display = type === 'short_text' || type === 'long_text' ? 'none' : 'block';
            addVariantBtn.style.display = type === 'short_text' || type === 'long_text' ? 'none' : 'block';
        }

        function removeQuestion(index) {
            const question = document.querySelector(`.question[data-index="${index}"]`);
            if (document.querySelectorAll('.question').length > 1) question.remove();
            else showNotification('Нельзя удалить последний вопрос!');
        }

        function createForm() {
            const name = document.getElementById('form-name').value.trim();
            const description = document.getElementById('form-description').value.trim();
            const questions = Array.from(document.querySelectorAll('.question')).map(q => {
                const type = q.querySelector('.question-type').value;
                return {
                    title: q.querySelector('.question-title').value.trim(),
                    type,
                    variants: type !== 'short_text' && type !== 'long_text' ? Array.from(q.querySelectorAll('.variant-title')).map(v => v.value.trim()).filter(v => v) : [],
                    stats: []
                };
            });

            if (!name || !description || questions.some(q => !q.title || (q.type !== 'short_text' && q.type !== 'long_text' && q.variants.length === 0))) {
                showNotification('Заполните все поля!');
                return;
            }

            const formData = {
                id: Date.now(),
                name,
                description,
                questions,
                creator: tg.initDataUnsafe.user?.username || 'Anonymous'
            };

            forms.push(formData);
            localStorage.setItem('forms', JSON.stringify(forms));
            tg.sendData(JSON.stringify(formData));
            showNotification('Форма создана!');
            document.getElementById('form-name').value = '';
            document.getElementById('form-description').value = '';
            document.getElementById('questions').innerHTML = `
                <div class="question" data-index="0">
                    <input type="text" class="question-title" placeholder="Название вопроса">
                    <select class="question-type" onchange="updateVariants(0)">
                        <option value="short_text">Короткий текст</option>
                        <option value="long_text">Длинный текст</option>
                        <option value="radio">Один выбор</option>
                        <option value="checkbox">Множественный выбор</option>
                        <option value="dropdown">Выпадающий список</option>
                    </select>
                    <div class="variants" data-index="0">
                        <div class="variant">
                            <input type="text" class="variant-title" placeholder="Вариант ответа">
                            <button onclick="removeVariant(0, 0)">Удалить</button>
                        </div>
                    </div>
                    <button class="add-variant" onclick="addVariant(0)">Добавить вариант</button>
                    <button class="delete" onclick="removeQuestion(0)">Удалить вопрос</button>
                </div>
            `;
            questionCount = 1;
            loadForms();
            backToMain();
        }

        function loadForms() {
            const formsContainer = document.getElementById('forms-container');
            const mainFormsContainer = document.getElementById('main-forms-container');
            formsContainer.innerHTML = forms.length ? '' : '<p>Нет доступных форм</p>';
            mainFormsContainer.innerHTML = forms.length ? '' : '<p>Нет популярных форм</p>';
            forms.forEach(form => {
                const formCard = document.createElement('div');
                formCard.classList.add('form-card');
                formCard.innerHTML = `
                    <h3>${form.name}</h3>
                    <p>${form.description}</p>
                    <p>Создатель: @${form.creator}</p>
                    <button class="form-link" onclick="viewForm(${form.id})">Открыть</button>
                `;
                formsContainer.appendChild(formCard);
                mainFormsContainer.appendChild(formCard.cloneNode(true));
            });
        }

        function viewForm(formId) {
            const form = forms.find(f => f.id === formId);
            if (!form) return;

            document.querySelector('.create-button').style.display = 'none';
            document.querySelector('.forms-button').style.display = 'none';
            document.querySelector('.main-list').style.display = 'none';
            document.querySelector('.form-builder').classList.remove('active');
            document.querySelector('.forms-list').classList.remove('active');
            document.querySelector('.form-viewer').classList.add('active');

            document.getElementById('viewer-title').textContent = form.name;
            document.getElementById('viewer-description').textContent = form.description;

            const questionsDiv = document.getElementById('viewer-questions');
            questionsDiv.innerHTML = '';
            form.questions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.classList.add('question-view');
                let content = `<label>${q.title}</label>`;
                if (q.type === 'short_text') content += '<input type="text" placeholder="Ваш ответ">';
                else if (q.type === 'long_text') content += '<textarea placeholder="Ваш ответ"></textarea>';
                else if (q.type === 'radio') {
                    const totalVotes = q.stats.reduce((a, b) => a + b, 0) || 1;
                    q.variants.forEach((v, i) => {
                        const percentage = ((q.stats[i] || 0) / totalVotes * 100).toFixed(1);
                        content += `
                            <div class="variant-view">
                                <input type="radio" name="q${index}" value="${v}"> ${v}
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${percentage}%"></div>
                                </div>
                                <div class="variant-stats">${q.stats[i] || 0} (${percentage}%)</div>
                            </div>
                        `;
                    });
                } else if (q.type === 'checkbox') {
                    const totalVotes = q.stats.reduce((a, b) => a + b, 0) || 1;
                    q.variants.forEach((v, i) => {
                        const percentage = ((q.stats[i] || 0) / totalVotes * 100).toFixed(1);
                        content += `
                            <div class="variant-view">
                                <input type="checkbox" name="q${index}" value="${v}"> ${v}
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${percentage}%"></div>
                                </div>
                                <div class="variant-stats">${q.stats[i] || 0} (${percentage}%)</div>
                            </div>
                        `;
                    });
                } else if (q.type === 'dropdown') {
                    const totalVotes = q.stats.reduce((a, b) => a + b, 0) || 1;
                    content += `<select name="q${index}">`;
                    q.variants.forEach(v => content += `<option value="${v}">${v}</option>`);
                    content += `</select>`;
                    q.variants.forEach((v, i) => {
                        const percentage = ((q.stats[i] || 0) / totalVotes * 100).toFixed(1);
                        content += `
                            <div class="variant-view">
                                <span>${v}</span>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${percentage}%"></div>
                                </div>
                                <div class="variant-stats">${q.stats[i] || 0} (${percentage}%)</div>
                            </div>
                        `;
                    });
                }
                questionDiv.innerHTML = content;
                questionsDiv.appendChild(questionDiv);
            });

            tg.MainButton.show();
            tg.MainButton.setText('Назад');
            tg.MainButton.onClick(backToMain);

            const urlParams = new URLSearchParams(window.location.search);
            const formIdFromUrl = urlParams.get('form_id');
            if (formIdFromUrl && parseInt(formIdFromUrl) === formId) viewForm(parseInt(formIdFromUrl));
        }

        function submitAnswers() {
            const formViewer = document.querySelector('.form-viewer');
            const formId = forms.find(f => f.name === document.getElementById('viewer-title').textContent)?.id;
            const form = forms.find(f => f.id === formId);
            if (!form) return;

            const answers = [];
            form.questions.forEach((q, index) => {
                if (q.type === 'short_text') {
                    const answer = formViewer.querySelector(`input[type="text"]:nth-of-type(${index + 1})`)?.value.trim();
                    if (answer) answers.push({ question: q.title, answer });
                } else if (q.type === 'long_text') {
                    const answer = formViewer.querySelector(`textarea:nth-of-type(${index + 1})`)?.value.trim();
                    if (answer) answers.push({ question: q.title, answer });
                } else if (q.type === 'radio') {
                    const selected = formViewer.querySelector(`input[name="q${index}"]:checked`)?.value;
                    if (selected) {
                        const variantIndex = q.variants.indexOf(selected);
                        q.stats[variantIndex] = (q.stats[variantIndex] || 0) + 1;
                        answers.push({ question: q.title, answer: selected });
                    }
                } else if (q.type === 'checkbox') {
                    const selected = Array.from(formViewer.querySelectorAll(`input[name="q${index}"]:checked`)).map(input => {
                        const value = input.value;
                        const variantIndex = q.variants.indexOf(value);
                        q.stats[variantIndex] = (q.stats[variantIndex] || 0) + 1;
                        return value;
                    });
                    if (selected.length) answers.push({ question: q.title, answer: selected });
                } else if (q.type === 'dropdown') {
                    const selected = formViewer.querySelector(`select[name="q${index}"]`)?.value;
                    if (selected) {
                        const variantIndex = q.variants.indexOf(selected);
                        q.stats[variantIndex] = (q.stats[variantIndex] || 0) + 1;
                        answers.push({ question: q.title, answer: selected });
                    }
                }
            });

            if (!answers.length) {
                showNotification('Выберите или введите ответ!');
                return;
            }

            localStorage.setItem('forms', JSON.stringify(forms));
            tg.sendData(JSON.stringify({ formId, answers }));
            showNotification('Ответы отправлены!');
            loadForms();
            viewForm(formId);
        }

        document.querySelector('.create-button').onclick = startFormBuilder;
        document.querySelector('.forms-button').onclick = showFormsList;
        document.querySelector('#create-form').onclick = createForm;
        document.querySelector('#submit-answers').onclick = submitAnswers;
        document.querySelectorAll('.back-button').forEach(btn => btn.onclick = backToMain);

        loadForms();

        const urlParams = new URLSearchParams(window.location.search);
        const formIdFromUrl = urlParams.get('form_id');
        if (formIdFromUrl) viewForm(parseInt(formIdFromUrl));
    </script>
</body>
</html>
